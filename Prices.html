<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Υπολογισμός Επάθλων — Main Draw & Finals</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3a5c">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supervisor Tools">

<meta name="description" content="Υπολογισμός επάθλων για κύριο ταμπλό 8 ή 12 ομάδων και finals." />
<style>
  :root {
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-300: #cbd5e1;
    --slate-500: #64748b;
    --slate-700: #334155;
    --slate-800: #1e293b;
    --slate-900: #0f172a;
    --red-600: #dc2626;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    font-family: Calibri, Candara, Segoe, "Segoe UI", Optima, Arial, sans-serif;
    background: var(--slate-50);
    color: var(--slate-900);
  }
  .wrap {
    max-width: 56rem;
    margin: 0 auto;
    padding: 2.5rem 1.5rem;
  }
  header { margin: 1rem 0 1.75rem; padding: 1.4rem 1.25rem 1.5rem; border-radius: 18px;
           background: linear-gradient(135deg, #0d3a5c 0%, #155a8a 100%); color: #fff; }
  header h1 { color: #fff; }
  header .subtitle { color: rgba(255,255,255,0.82); }
  .logo-row {
    margin-bottom: 1rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.25rem;
  }
  .logo-link { display: inline-block; flex-shrink: 0; }
  .logo-row img { height: 3.5rem; width: auto; display: block; }
  .mail-link {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--slate-500);
    text-decoration: underline;
    text-decoration-style: dotted;
  }
  .mail-link:hover { color: var(--slate-800); }
  h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; margin: 0; }
  .subtitle { margin-top: 0.5rem; font-size: 0.875rem; color: var(--slate-500); }

  .card {
    margin-top: 1.5rem;
    border-radius: 0.5rem;
    border: 1px solid var(--slate-200);
    background: #fff;
    padding: 1.5rem;
  }
  .grid-2 {
    display: grid;
    gap: 1rem;
  }
  @media (min-width: 640px) {
    .grid-2 { grid-template-columns: 1fr 1fr; }
  }
  label.field-label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
  }
  #fmtGroup {
    margin-top: 0.5rem;
    display: inline-flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    border-radius: 0.375rem;
    border: 1px solid var(--slate-200);
    padding: 0.25rem;
  }
  #fmtGroup button {
    padding: 0.375rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: 0.25rem;
    border: none;
    background: transparent;
    color: var(--slate-500);
    cursor: pointer;
  }
  #fmtGroup button.on {
    background: var(--slate-900);
    color: #fff;
  }
  input[type="number"] {
    border-radius: 0.375rem;
    border: 1px solid var(--slate-300);
    background: #fff;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
  }
  #prize { margin-top: 0.5rem; width: 100%; }

  #groups { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .group-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .group-row .g-label { width: 4rem; font-size: 0.875rem; font-weight: 500; }
  .group-row .g-positions { width: 6rem; font-size: 0.75rem; color: var(--slate-500); }
  .group-row input[type="number"].g-percent { width: 7rem; }
  .group-row .g-pct-label { font-size: 0.875rem; color: var(--slate-500); }
  .group-row .g-amount { margin-left: auto; font-size: 0.875rem; }

  #totalPct { margin-top: 1rem; font-size: 0.875rem; color: var(--slate-500); }
  #totalPct.warn { color: var(--red-600); }

  .table-card {
    margin-top: 1.5rem;
    overflow: hidden;
    border-radius: 0.5rem;
    border: 1px solid var(--slate-200);
    background: #fff;
  }
  table { width: 100%; font-size: 0.875rem; border-collapse: collapse; }
  thead { background: var(--slate-100); color: var(--slate-500); }
  th { padding: 0.5rem 1rem; text-align: left; }
  th.right, td.right { text-align: right; }
  td { padding: 0.5rem 1rem; }
  tbody tr { border-top: 1px solid var(--slate-200); }
  tr.total-row { background: var(--slate-100); font-weight: 600; }

  .actions { margin-top: 1.5rem; display: flex; justify-content: flex-end; }
  #download {
    border-radius: 0.375rem;
    background: var(--slate-900);
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  #download:hover { background: var(--slate-700); }
</style>
<script src="bv-admin.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<nav class="bv-topbar" aria-label="Πλοήγηση"><a class="bv-home" href="index.html" aria-label="Αρχική" title="Αρχική"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-6h4v6"/></svg></a><a class="bv-brand" href="index.html"><img src="icons/logo.png" alt="">Supervisor Tools</a></nav>
<div class="wrap">
  <header>
    <h1>Υπολογισμός Επάθλων</h1>
    <p class="subtitle">Κύριο ταμπλό (8 ή 12 ομάδες) ή Finals.</p>
  </header>

  <section class="card">
    <div class="grid-2">
      <div>
        <label class="field-label">Format</label>
        <div id="fmtGroup"></div>
      </div>
      <div>
        <label class="field-label" for="prize">Συνολικό Έπαθλο (€)</label>
        <input id="prize" type="number" value="2500" min="0" step="50" />
      </div>
    </div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 0.75rem;font-size:0.875rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate-500);">Ποσοστά ανά θέση</h2>
    <div id="groups"></div>
    <div id="totalPct"></div>
  </section>

  <section class="table-card">
    <table>
      <thead>
        <tr>
          <th>Θέση</th>
          <th class="right">Ομάδα</th>
          <th class="right">Αθλητής</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

  <div class="actions">
    <button id="download">Κατέβασμα Excel</button>
  </div>
</div>

<script>
const FORMAT_LABEL = { "8": "8 ομάδες", "12": "12 ομάδες", "finals": "Finals" };
const DEFAULTS = {
  "8": [
    { label: "1", positions: 1, percent: 30 },
    { label: "2", positions: 1, percent: 20 },
    { label: "3-4", positions: 2, percent: 12 },
    { label: "5-6", positions: 2, percent: 8 },
    { label: "7-8", positions: 2, percent: 5 },
  ],
  "12": [
    { label: "1", positions: 1, percent: 30 },
    { label: "2", positions: 1, percent: 20 },
    { label: "3-4", positions: 2, percent: 12 },
    { label: "5-8", positions: 4, percent: 6.5 },
  ],
  "finals": [
    { label: "1", positions: 1, percent: 30 },
    { label: "2", positions: 1, percent: 20 },
    { label: "3", positions: 1, percent: 14 },
    { label: "4", positions: 1, percent: 10 },
    { label: "5-6", positions: 2, percent: 8 },
    { label: "7-8", positions: 2, percent: 5 },
  ],
};

let state = { format: "8", prize: 2500, groups: JSON.parse(JSON.stringify(DEFAULTS)) };
// Οι ρυθμίσεις μένουν στη συσκευή και τις χρησιμοποιεί και το «Φύλλο πληρωμής επάθλων».
const PRICES_KEY = "pricesState_v1";
try {
  const saved = JSON.parse(localStorage.getItem(PRICES_KEY) || "null");
  if (saved && saved.groups) state = Object.assign(state, saved);
} catch (e) {}
function savePrices() { try { localStorage.setItem(PRICES_KEY, JSON.stringify(state)); } catch (e) {} }
const fmt = n => new Intl.NumberFormat("el-GR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(n);

function renderFmt() {
  const g = document.getElementById("fmtGroup");
  g.innerHTML = "";
  Object.keys(FORMAT_LABEL).forEach(k => {
    const b = document.createElement("button");
    const on = k === state.format;
    b.className = on ? "on" : "";
    b.textContent = FORMAT_LABEL[k];
    b.addEventListener("click", () => { state.format = k; render(); });
    g.appendChild(b);
  });
}

function render() {
  savePrices();
  renderFmt();
  const active = state.groups[state.format];
  const gEl = document.getElementById("groups");
  gEl.innerHTML = "";
  active.forEach((g, i) => {
    const row = document.createElement("div");
    row.className = "group-row";
    row.innerHTML = `
      <span class="g-label">${g.label}</span>
      <span class="g-positions">${g.positions} θέση(εις)</span>
      <input type="number" step="0.01" value="${g.percent}" class="g-percent" />
      <span class="g-pct-label">% ανά θέση</span>
      <span class="g-amount">${fmt((state.prize * g.percent) / 100)}</span>`;
    row.querySelector("input").addEventListener("input", e => {
      active[i].percent = Number(e.target.value) || 0;
      render();
    });
    gEl.appendChild(row);
  });
  const totalPct = active.reduce((s, g) => s + g.percent * g.positions, 0);
  const tp = document.getElementById("totalPct");
  tp.textContent = `Σύνολο ποσοστών: ${totalPct.toFixed(2)}%`;
  tp.className = Math.abs(totalPct - 100) < 0.01 ? "" : "warn";
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  let idx = 1, teamTotal = 0, athleteTotal = 0;
  for (const g of active) {
    for (let i = 0; i < g.positions; i++) {
      const team = (state.prize * g.percent) / 100;
      const athlete = team / 2;
      teamTotal += team; athleteTotal += athlete;
      const pos = g.positions === 1 ? String(idx) : i === 0 ? g.label : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${pos}</td><td class="right">${fmt(team)}</td><td class="right">${fmt(athlete)}</td>`;
      tbody.appendChild(tr);
      idx++;
    }
  }
  const tot = document.createElement("tr");
  tot.className = "total-row";
  tot.innerHTML = `<td>Σύνολο</td><td class="right">${fmt(teamTotal)}</td><td class="right">${fmt(athleteTotal)}</td>`;
  tbody.appendChild(tot);
}

document.getElementById("prize").addEventListener("input", e => {
  state.prize = Number(e.target.value) || 0; render();
});

// Builds a self-contained Excel file (SpreadsheetML 2003 XML format) with no
// external libraries or CDNs required — Excel opens this natively.
function xmlEscape(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function buildExcelXml(rows) {
  const header = `<Row>` +
    `<Cell><Data ss:Type="String">Θέση</Data></Cell>` +
    `<Cell><Data ss:Type="String">Ομάδα (€)</Data></Cell>` +
    `<Cell><Data ss:Type="String">Αθλητής (€)</Data></Cell>` +
    `</Row>`;
  const body = rows.map(r => `<Row>` +
    `<Cell><Data ss:Type="String">${xmlEscape(r["Θέση"])}</Data></Cell>` +
    `<Cell><Data ss:Type="Number">${r["Ομάδα (€)"]}</Data></Cell>` +
    `<Cell><Data ss:Type="Number">${r["Αθλητής (€)"]}</Data></Cell>` +
    `</Row>`).join("");

  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Worksheet ss:Name="Επαθλα">
  <Table>
   <Column ss:Width="70"/>
   <Column ss:Width="90"/>
   <Column ss:Width="90"/>
   ${header}
   ${body}
  </Table>
 </Worksheet>
</Workbook>`;
}

document.getElementById("download").addEventListener("click", () => {
  const active = state.groups[state.format];
  const rows = [];
  let idx = 1, teamTotal = 0, athleteTotal = 0;
  for (const g of active) {
    for (let i = 0; i < g.positions; i++) {
      const team = (state.prize * g.percent) / 100;
      const athlete = team / 2;
      teamTotal += team; athleteTotal += athlete;
      const pos = g.positions === 1 ? String(idx) : i === 0 ? g.label : "";
      rows.push({ "Θέση": pos, "Ομάδα (€)": Number(team.toFixed(2)), "Αθλητής (€)": Number(athlete.toFixed(2)) });
      idx++;
    }
  }
  rows.push({ "Θέση": "Σύνολο", "Ομάδα (€)": Number(teamTotal.toFixed(2)), "Αθλητής (€)": Number(athleteTotal.toFixed(2)) });

  const xml = buildExcelXml(rows);
  const blob = new Blob([xml], { type: "application/vnd.ms-excel" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `epathla-${state.format}-${state.prize}eur.xls`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById("prize").value = state.prize;
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
</body>
</html>
